<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <rect width="1200" height="480" fill="#000"/>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2dd4bf" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity=".02"/>
    </linearGradient>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#f2ebe8}
      .muted{fill:#8a7f7a}.tiny{font-size:11px}.small{font-size:13px}.title{font-size:18px;font-weight:700}.strong{font-weight:700}
      .card{fill:#141414;stroke:#2a2a2a}
    </style>
  </defs>
  <text x="28" y="40" class="title">Usage over time</text>
  <text x="28" y="60" class="tiny muted">Actual vs expected · anomaly callouts like an observability tool</text>

  <g transform="translate(28 84)">
    <rect width="860" height="360" rx="16" class="card"/>
    <g class="tiny muted">
      <rect x="24" y="20" width="10" height="10" rx="2" fill="#2dd4bf"/><text x="40" y="29">Actual</text>
      <line x1="110" y1="25" x2="124" y2="25" stroke="#8a7f7a" stroke-dasharray="3 2"/>
      <text x="132" y="29">Expected (7-day avg)</text>
    </g>
    <line x1="60" y1="80" x2="820" y2="80" stroke="#ffffff14" stroke-dasharray="3 5"/>
    <line x1="60" y1="140" x2="820" y2="140" stroke="#ffffff14" stroke-dasharray="3 5"/>
    <line x1="60" y1="200" x2="820" y2="200" stroke="#ffffff14" stroke-dasharray="3 5"/>
    <line x1="60" y1="260" x2="820" y2="260" stroke="#ffffff14" stroke-dasharray="3 5"/>
    <line x1="60" y1="320" x2="820" y2="320" stroke="#ffffff14" stroke-dasharray="3 5"/>
    <text x="52" y="84" text-anchor="end" class="tiny muted">$40</text>
    <text x="52" y="204" text-anchor="end" class="tiny muted">$20</text>
    <text x="52" y="324" text-anchor="end" class="tiny muted">$0</text>
    <rect x="620" y="80" width="28" height="240" fill="#f87171" opacity=".12"/>
    <path d="M80 280 L160 250 L240 260 L320 220 L400 235 L480 200 L560 210 L640 110 L720 190 L800 170" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M80 280 L160 250 L240 260 L320 220 L400 235 L480 200 L560 210 L640 110 L720 190 L800 170 L800 320 L80 320 Z" fill="url(#fill)"/>
    <path d="M80 270 L160 265 L240 260 L320 250 L400 245 L480 240 L560 235 L640 230 L720 225 L800 220" fill="none" stroke="#8a7f7a" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="160" cy="250" r="3.5" fill="#2dd4bf" stroke="#fff" stroke-width="1.5"/>
    <circle cx="320" cy="220" r="3.5" fill="#2dd4bf" stroke="#fff" stroke-width="1.5"/>
    <circle cx="480" cy="200" r="3.5" fill="#2dd4bf" stroke="#fff" stroke-width="1.5"/>
    <circle cx="640" cy="110" r="6" fill="#ff6b6b" stroke="#fff" stroke-width="2"/>
    <circle cx="800" cy="170" r="3.5" fill="#2dd4bf" stroke="#fff" stroke-width="1.5"/>
    <text x="80" y="345" class="tiny muted">Aug 1</text>
    <text x="320" y="345" class="tiny muted">Aug 5</text>
    <text x="560" y="345" class="tiny muted">Aug 9</text>
    <text x="760" y="345" class="tiny muted">Aug 12</text>
  </g>

  <g transform="translate(908 84)">
    <rect width="264" height="360" rx="16" fill="#141414" stroke="#3a2a2a"/>
    <circle cx="28" cy="34" r="5" fill="#f87171"/>
    <text x="42" y="39" class="small strong">Anomaly detected</text>
    <text x="24" y="78" class="title">Aug 10</text>
    <text x="24" y="110" class="small muted">$38.40 was 68% higher than the recent average.</text>
    <rect x="24" y="140" width="216" height="40" rx="10" fill="#f87171"/>
    <text x="132" y="165" text-anchor="middle" class="small strong" style="fill:#1a0f05">View anomaly</text>
    <text x="24" y="220" class="tiny muted">AI confidence</text>
    <rect x="24" y="232" width="216" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="24" y="232" width="190" height="8" rx="4" fill="#2dd4bf"/>
    <text x="24" y="268" class="small strong">88%</text>
  </g>
</svg>

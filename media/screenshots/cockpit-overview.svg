<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#000"/>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#f2ebe8}
      .muted{fill:#8a7f7a}.tiny{font-size:11px}.small{font-size:13px}.label{font-size:10px;letter-spacing:1.6px}
      .title{font-size:22px;font-weight:700}.h2{font-size:15px;font-weight:700}.strong{font-weight:700}
      .card{fill:#141414;stroke:#2a2a2a}
    </style>
  </defs>

  <rect x="22" y="20" width="1156" height="62" rx="16" class="card"/>
  <rect x="36" y="33" width="36" height="36" rx="11" fill="url(#brand)"/>
  <text x="54" y="56" text-anchor="middle" class="strong" style="fill:#041018;font-size:12px">CT</text>
  <text x="84" y="46" class="small strong">Cursor Token Cockpit</text>
  <text x="84" y="64" class="tiny muted">Grouped by model · multi-color series</text>
  <rect x="560" y="32" width="78" height="34" rx="17" fill="#2dd4bf"/>
  <text x="599" y="54" text-anchor="middle" class="tiny strong" style="fill:#041018">Refresh</text>

  <!-- Plan health: green ring at comfortable %, green Cursor bar, red Other at 100% -->
  <g transform="translate(40 110)">
    <rect width="360" height="280" rx="16" class="card"/>
    <text x="24" y="36" class="h2">Plan health</text>
    <text x="24" y="56" class="tiny muted">Bars tint by each pool's own usage</text>
    <circle cx="180" cy="150" r="70" fill="none" stroke="#1a1a1a" stroke-width="14"/>
    <circle cx="180" cy="150" r="70" fill="none" stroke="#3fb950" stroke-width="14" stroke-linecap="round" stroke-dasharray="110 440" transform="rotate(-90 180 150)"/>
    <text x="180" y="145" text-anchor="middle" class="title" style="fill:#3fb950">24%</text>
    <text x="180" y="170" text-anchor="middle" class="tiny muted">total usage</text>
    <text x="24" y="240" class="tiny muted">Cursor Models · 22%</text>
    <rect x="24" y="248" width="300" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="24" y="248" width="66" height="8" rx="4" fill="#3fb950"/>
    <text x="24" y="280" class="tiny muted">Other Models · 100%</text>
    <rect x="24" y="288" width="300" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="24" y="288" width="300" height="8" rx="4" fill="#ff2d2d"/>
  </g>

  <g transform="translate(420 110)">
    <rect width="740" height="280" rx="16" class="card"/>
    <text x="24" y="36" class="h2">Model mix</text>
    <text x="24" y="56" class="tiny muted">Same palette as Cache efficiency</text>
    <rect x="24" y="80" width="10" height="10" rx="2" fill="#2dd4bf"/><text x="42" y="89" class="tiny muted">Auto</text>
    <rect x="100" y="80" width="10" height="10" rx="2" fill="#3b82f6"/><text x="118" y="89" class="tiny muted">Sonnet</text>
    <rect x="190" y="80" width="10" height="10" rx="2" fill="#a855f7"/><text x="208" y="89" class="tiny muted">Grok</text>
    <rect x="270" y="80" width="10" height="10" rx="2" fill="#eab308"/><text x="288" y="89" class="tiny muted">Grok 4.7</text>
    <rect x="370" y="80" width="10" height="10" rx="2" fill="#f87171"/><text x="388" y="89" class="tiny muted">Composer</text>
    <path d="M40 220 L140 180 L240 120 L340 160 L440 140 L540 170 L640 150 L700 160" fill="none" stroke="#2dd4bf" stroke-width="2.6"/>
    <path d="M40 230 L240 220 L440 200 L640 210 L700 215" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M40 235 L340 210 L540 190 L700 200" fill="none" stroke="#a855f7" stroke-width="2"/>
    <path d="M40 240 L440 230 L700 235" fill="none" stroke="#eab308" stroke-width="2"/>
    <path d="M40 245 L540 242 L700 240" fill="none" stroke="#f87171" stroke-width="2"/>
  </g>


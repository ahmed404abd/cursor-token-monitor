    <rect width="1120" height="370" rx="16" class="card"/>
    <text x="24" y="36" class="h2">90-day heatmap</text>
    <text x="24" y="56" class="tiny muted">GitHub greens · spike outline only</text>
    <g transform="translate(40 80)">

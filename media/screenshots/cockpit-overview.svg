<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".35"/></filter>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#e6edf3}.muted{fill:#8b949e}.tiny{font-size:12px}.small{font-size:14px}.label{font-size:11px;letter-spacing:1.5px}.title{font-size:22px;font-weight:700}.strong{font-weight:700}.card{fill:#161b22;stroke:#30363d}.line{stroke:#30363d}.blue{fill:#58a6ff}.green{fill:#3fb950}.orange{fill:#d29922}.red{fill:#f85149}
    </style>
  </defs>
  <rect width="1200" height="720" rx="18" fill="url(#bg)"/>
  <rect x="20" y="18" width="1160" height="58" rx="12" class="card" filter="url(#shadow)"/>
  <rect x="34" y="31" width="32" height="32" rx="9" fill="url(#brand)"/>
  <text x="50" y="52" text-anchor="middle" class="strong">CT</text>
  <text x="78" y="44" class="small strong">Cursor Token Cockpit</text>
  <text x="78" y="61" class="tiny muted">Private usage intelligence for your signed-in account</text>
  <g transform="translate(690 30)">
    <rect width="78" height="34" rx="17" fill="#1f6feb"/><text x="39" y="22" text-anchor="middle" class="tiny strong">Refresh</text>
    <rect x="88" width="116" height="34" rx="17" fill="#162a42" stroke="#28517c"/><text x="146" y="22" text-anchor="middle" class="tiny blue">Group: Model</text>
    <rect x="214" width="96" height="34" rx="17" fill="#21262d" stroke="#30363d"/><text x="262" y="22" text-anchor="middle" class="tiny">Reset order</text>
    <rect x="320" width="48" height="34" rx="17" fill="#21262d" stroke="#30363d"/><text x="344" y="22" text-anchor="middle" class="tiny">CSV</text>
    <rect x="378" width="54" height="34" rx="17" fill="#21262d" stroke="#30363d"/><text x="405" y="22" text-anchor="middle" class="tiny">JSON</text>
    <rect x="442" width="48" height="34" rx="17" fill="#21262d" stroke="#30363d"/><text x="466" y="22" text-anchor="middle" class="tiny">MD</text>
  </g>
  <rect x="20" y="92" width="1160" height="226" rx="12" class="card" filter="url(#shadow)"/>
  <circle cx="105" cy="188" r="48" fill="none" stroke="#21262d" stroke-width="11"/>
  <circle cx="105" cy="188" r="48" fill="none" stroke="#d29922" stroke-width="11" stroke-linecap="round" stroke-dasharray="211 302" transform="rotate(-90 105 188)"/>
  <text x="105" y="188" text-anchor="middle" dominant-baseline="middle" class="title">70%</text>
  <text x="105" y="211" text-anchor="middle" class="tiny muted">used</text>
  <text x="180" y="146" class="label muted">PLAN DETAILS</text>
  <text x="180" y="179" class="title">Signed-in Cursor account</text>
  <rect x="456" y="156" width="90" height="27" rx="14" fill="#162a42"/><text x="501" y="174" text-anchor="middle" class="tiny blue strong">Pro   $20/mo</text>
  <text x="180" y="205" class="small muted">Your allowance is healthy, with 12 days left in this billing cycle.</text>
  <g transform="translate(820 128)">
    <text y="0" class="small muted">Used</text><text x="300" y="0" text-anchor="end" class="small strong">$14.08</text>
    <text y="28" class="small muted">Limit</text><text x="300" y="28" text-anchor="end" class="small strong">$20.00</text>
    <text y="56" class="small muted">Remaining</text><text x="300" y="56" text-anchor="end" class="small strong">$5.92</text>
    <text y="84" class="small muted">Billing cycle</text><text x="300" y="84" text-anchor="end" class="small strong">Jul 22   Aug 22</text>
    <text y="112" class="small muted">Reset in</text><text x="300" y="112" text-anchor="end" class="small strong">12d 7h</text>
  </g>
  <line x1="42" y1="268" x2="1158" y2="268" class="line"/>
  <text x="42" y="296" class="small blue strong">Show daily details</text>
  <text x="20" y="350" class="small strong">This session</text>
  <text x="20" y="368" class="tiny muted">Usage since this editor window opened</text>
  <g transform="translate(20 382)">
    <g><rect width="278" height="82" rx="10" class="card"/><text x="16" y="25" class="label muted">STARTED</text><text x="16" y="57" class="title">8:42 PM</text></g>
    <g transform="translate(294)"><rect width="278" height="82" rx="10" class="card"/><text x="16" y="25" class="label muted">REQUESTS</text><text x="16" y="57" class="title">32</text></g>
    <g transform="translate(588)"><rect width="278" height="82" rx="10" class="card"/><text x="16" y="25" class="label muted">TOKENS</text><text x="16" y="57" class="title">842k</text></g>
    <g transform="translate(882)"><rect width="278" height="82" rx="10" class="card"/><text x="16" y="25" class="label muted">SPEND</text><text x="16" y="57" class="title">$3.16</text></g>
  </g>
  <text x="20" y="505" class="small strong">Usage intelligence</text>
  <text x="20" y="523" class="tiny muted">Signals derived from recent usage and your configured thresholds</text>
  <g transform="translate(20 540)">
    <rect width="370" height="128" rx="10" class="card" stroke="#28517c"/>
    <circle cx="24" cy="26" r="5" class="green"/><text x="38" y="31" class="small strong">Allowance on track</text>
    <text x="18" y="58" class="small muted">You have used 70% of the included allowance.</text>
    <text x="18" y="84" class="tiny muted">Current pace stays within the cycle limit.</text>
    <rect x="405" width="370" height="128" rx="10" class="card" stroke="#604f1d"/>
    <circle cx="429" cy="26" r="5" class="orange"/><text x="443" y="31" class="small strong">High activity today</text>
    <text x="423" y="58" class="small muted">32 requests across 4 models.</text>
    <text x="423" y="84" class="tiny muted">Today's spend is 1.4  the 7-day average.</text>
    <rect x="790" width="370" height="128" rx="10" class="card" stroke="#28517c"/>
    <circle cx="814" cy="26" r="5" class="blue"/><text x="828" y="31" class="small strong">Top model: Composer</text>
    <text x="808" y="58" class="small muted">42% of this cycle's model spend.</text>
    <text x="808" y="84" class="tiny muted">Pin any model for status-bar tracking.</text>
  </g>
  <text x="1160" y="702" text-anchor="end" class="tiny muted">Sample data   no account details shown</text>
</svg>

    <!-- Token trends — clear gap below legend -->
    <text x="40" y="200" class="h2">Token trends</text>
    <text x="40" y="220" class="tiny muted">Daily volume · green intensity scale</text>
    <g transform="translate(40 240)">
      <rect x="0" y="50" width="18" height="40" rx="3" fill="#0e4429"/>
      <rect x="24" y="30" width="18" height="60" rx="3" fill="#006d32"/>
      <rect x="48" y="10" width="18" height="80" rx="3" fill="#26a641"/>
      <rect x="72" y="20" width="18" height="70" rx="3" fill="#006d32"/>
      <rect x="96" y="0" width="18" height="90" rx="3" fill="#39d353"/>
      <rect x="120" y="25" width="18" height="65" rx="3" fill="#26a641"/>
      <rect x="144" y="40" width="18" height="50" rx="3" fill="#0e4429"/>
      <rect x="168" y="15" width="18" height="75" rx="3" fill="#26a641"/>
      <rect x="192" y="5" width="18" height="85" rx="3" fill="#39d353"/>
      <rect x="216" y="30" width="18" height="60" rx="3" fill="#006d32"/>

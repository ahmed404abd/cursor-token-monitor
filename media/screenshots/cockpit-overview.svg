      <rect x="22" width="16" height="16" rx="3" fill="#0e4429"/>
      <rect x="44" width="16" height="16" rx="3" fill="#006d32"/>
      <rect x="66" width="16" height="16" rx="3" fill="#26a641"/>
      <rect x="88" width="16" height="16" rx="3" fill="#39d353"/>

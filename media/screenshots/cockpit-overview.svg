      <rect x="132" width="16" height="16" rx="3" fill="#39d353" stroke="#f85149" stroke-width="2"/>
      <rect x="154" width="16" height="16" rx="3" fill="#0e4429"/>
      <rect x="176" width="16" height="16" rx="3" fill="#006d32"/>
      <rect x="198" width="16" height="16" rx="3" fill="#26a641"/>
      <rect x="220" width="16" height="16" rx="3" fill="#39d353"/>
      <rect x="242" width="16" height="16" rx="3" fill="#0e4429"/>
      <rect x="264" width="16" height="16" rx="3" fill="#006d32"/>
      <rect x="286" width="16" height="16" rx="3" fill="#26a641"/>
      <rect x="308" width="16" height="16" rx="3" fill="#161b22"/>
      <rect y="22" width="16" height="16" rx="3" fill="#0e4429"/>
      <rect x="22" y="22" width="16" height="16" rx="3" fill="#26a641"/>
      <rect x="44" y="22" width="16" height="16" rx="3" fill="#39d353"/>
      <rect x="66" y="22" width="16" height="16" rx="3" fill="#006d32"/>
      <rect x="88" y="22" width="16" height="16" rx="3" fill="#0e4429"/>
      <rect x="110" y="22" width="16" height="16" rx="3" fill="#26a641"/>
      <rect x="132" y="22" width="16" height="16" rx="3" fill="#006d32"/>
      <rect x="154" y="22" width="16" height="16" rx="3" fill="#39d353"/>
      <rect x="176" y="22" width="16" height="16" rx="3" fill="#26a641"/>
      <rect x="198" y="22" width="16" height="16" rx="3" fill="#0e4429"/>
      <rect x="220" y="22" width="16" height="16" rx="3" fill="#006d32"/>
      <rect x="242" y="22" width="16" height="16" rx="3" fill="#39d353"/>
      <rect x="264" y="22" width="16" height="16" rx="3" fill="#26a641"/>
      <rect x="286" y="22" width="16" height="16" rx="3" fill="#0e4429"/>
      <rect x="308" y="22" width="16" height="16" rx="3" fill="#26a641"/>
    </g>
    <text x="40" y="150" class="tiny muted">Less</text>
    <rect x="80" y="138" width="14" height="14" rx="3" fill="#0e4429"/>
    <rect x="98" y="138" width="14" height="14" rx="3" fill="#006d32"/>
    <rect x="116" y="138" width="14" height="14" rx="3" fill="#26a641"/>
    <rect x="134" y="138" width="14" height="14" rx="3" fill="#39d353"/>
    <text x="158" y="150" class="tiny muted">More</text>
    <rect x="220" y="138" width="14" height="14" rx="3" fill="#26a641" stroke="#d29922" stroke-width="1.5"/>
    <text x="242" y="150" class="tiny muted">Spike</text>
    <rect x="300" y="138" width="14" height="14" rx="3" fill="#39d353" stroke="#f85149" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <rect width="1200" height="580" fill="#000"/>
  <defs>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#f2ebe8}
      .muted{fill:#8a7f7a}.tiny{font-size:11px}.small{font-size:13px}.title{font-size:18px;font-weight:700}.strong{font-weight:700}
      .card{fill:#141414;stroke:#2a2a2a}
    </style>
  </defs>
  <text x="28" y="42" class="title">Quota cards</text>
  <text x="28" y="62" class="tiny muted">Drag to reorder · pin models to the status bar</text>

  <!-- Composer / teal healthy -->
  <g transform="translate(28 84)">
    <rect width="360" height="220" rx="16" class="card"/>
    <circle cx="22" cy="28" r="5" fill="#2dd4bf"/>
    <text x="36" y="33" class="small strong">Composer</text>
    <text x="36" y="50" class="tiny muted">Healthy · 42% of spend</text>
    <circle cx="72" cy="128" r="40" fill="none" stroke="#1a1a1a" stroke-width="9"/>
    <circle cx="72" cy="128" r="40" fill="none" stroke="#2dd4bf" stroke-width="9" stroke-linecap="round" stroke-dasharray="168 251" transform="rotate(-90 72 128)"/>
    <text x="72" y="133" text-anchor="middle" class="small strong">42%</text>
    <text x="140" y="108" class="tiny muted">Spend</text>
    <text x="330" y="108" text-anchor="end" class="small strong">$8.40</text>
    <text x="140" y="130" class="tiny muted">Tokens</text>
    <text x="330" y="130" text-anchor="end" class="small strong">412k</text>
    <text x="140" y="158" class="tiny muted">Input</text>
    <rect x="140" y="164" width="180" height="6" rx="3" fill="#1a1a1a"/>
    <rect x="140" y="164" width="120" height="6" rx="3" fill="#2dd4bf"/>
    <text x="140" y="190" class="tiny muted">Output</text>
    <rect x="140" y="196" width="180" height="6" rx="3" fill="#1a1a1a"/>
    <rect x="140" y="196" width="72" height="6" rx="3" fill="#3b82f6"/>
  </g>

  <!-- Sonnet / blue warning -->
  <g transform="translate(420 84)">
    <rect width="360" height="220" rx="16" class="card"/>
    <circle cx="22" cy="28" r="5" fill="#3b82f6"/>
    <text x="36" y="33" class="small strong">claude-4-sonnet</text>
    <text x="36" y="50" class="tiny muted">Warning · 28% of spend</text>
    <circle cx="72" cy="128" r="40" fill="none" stroke="#1a1a1a" stroke-width="9"/>
    <circle cx="72" cy="128" r="40" fill="none" stroke="#eab308" stroke-width="9" stroke-linecap="round" stroke-dasharray="112 251" transform="rotate(-90 72 128)"/>
    <text x="72" y="133" text-anchor="middle" class="small strong">28%</text>
    <text x="140" y="108" class="tiny muted">Spend</text>
    <text x="330" y="108" text-anchor="end" class="small strong">$5.60</text>
    <text x="140" y="130" class="tiny muted">Tokens</text>
    <text x="330" y="130" text-anchor="end" class="small strong">290k</text>
    <text x="140" y="158" class="tiny muted">Input</text>
    <rect x="140" y="164" width="180" height="6" rx="3" fill="#1a1a1a"/>
    <rect x="140" y="164" width="100" height="6" rx="3" fill="#3b82f6"/>
    <text x="140" y="190" class="tiny muted">Output</text>
    <rect x="140" y="196" width="180" height="6" rx="3" fill="#1a1a1a"/>
    <rect x="140" y="196" width="60" height="6" rx="3" fill="#a855f7"/>
  </g>

  <!-- Auto / purple -->
  <g transform="translate(812 84)">
    <rect width="360" height="220" rx="16" class="card"/>
    <circle cx="22" cy="28" r="5" fill="#a855f7"/>
    <text x="36" y="33" class="small strong">Auto</text>
    <text x="36" y="50" class="tiny muted">Healthy · 73% of spend</text>
    <circle cx="72" cy="128" r="40" fill="none" stroke="#1a1a1a" stroke-width="9"/>
    <circle cx="72" cy="128" r="40" fill="none" stroke="#a855f7" stroke-width="9" stroke-linecap="round" stroke-dasharray="200 251" transform="rotate(-90 72 128)"/>
    <text x="72" y="133" text-anchor="middle" class="small strong">73%</text>
    <text x="140" y="108" class="tiny muted">Spend</text>
    <text x="330" y="108" text-anchor="end" class="small strong">$79.13</text>
    <text x="140" y="130" class="tiny muted">Tokens</text>
    <text x="330" y="130" text-anchor="end" class="small strong">1.2M</text>
    <text x="140" y="158" class="tiny muted">Input</text>
    <rect x="140" y="164" width="180" height="6" rx="3" fill="#1a1a1a"/>
    <rect x="140" y="164" width="150" height="6" rx="3" fill="#a855f7"/>
    <text x="140" y="190" class="tiny muted">Output</text>
    <rect x="140" y="196" width="180" height="6" rx="3" fill="#1a1a1a"/>
    <rect x="140" y="196" width="48" height="6" rx="3" fill="#eab308"/>
  </g>

  <!-- Grok / gold -->
  <g transform="translate(28 340)">
    <rect width="360" height="200" rx="16" class="card"/>
    <circle cx="22" cy="28" r="5" fill="#eab308"/>
    <text x="36" y="33" class="small strong">Grok 4.6 High Fast</text>
    <text x="36" y="50" class="tiny muted">Healthy · 11% of spend</text>
    <circle cx="72" cy="118" r="36" fill="none" stroke="#1a1a1a" stroke-width="8"/>
    <circle cx="72" cy="118" r="36" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round" stroke-dasharray="50 226" transform="rotate(-90 72 118)"/>
    <text x="72" y="123" text-anchor="middle" class="small strong">11%</text>
    <text x="140" y="100" class="tiny muted">Spend</text>
    <text x="330" y="100" text-anchor="end" class="small strong">$12.00</text>
    <text x="140" y="130" class="tiny muted">Share bar</text>
    <rect x="140" y="140" width="190" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="140" y="140" width="70" height="8" rx="4" fill="#eab308"/>
  </g>

  <!-- Composer Fast / coral -->
  <g transform="translate(420 340)">
    <rect width="360" height="200" rx="16" class="card"/>
    <circle cx="22" cy="28" r="5" fill="#f87171"/>
    <text x="36" y="33" class="small strong">Composer 2.5 Fast</text>
    <text x="36" y="50" class="tiny muted">Healthy · 1% of spend</text>
    <circle cx="72" cy="118" r="36" fill="none" stroke="#1a1a1a" stroke-width="8"/>
    <circle cx="72" cy="118" r="36" fill="none" stroke="#f87171" stroke-width="8" stroke-linecap="round" stroke-dasharray="20 226" transform="rotate(-90 72 118)"/>
    <text x="72" y="123" text-anchor="middle" class="small strong">1%</text>
    <text x="140" y="100" class="tiny muted">Spend</text>
    <text x="330" y="100" text-anchor="end" class="small strong">$1.10</text>
    <text x="140" y="130" class="tiny muted">Share bar</text>
    <rect x="140" y="140" width="190" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="140" y="140" width="18" height="8" rx="4" fill="#f87171"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <rect width="1200" height="480" fill="#000000"/>
  <defs>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#f2ebe8}
      .muted{fill:#8a7f7a}.tiny{font-size:11px}.small{font-size:13px}.title{font-size:20px;font-weight:700}
      .kpi{fill:#121212;stroke:#2a1a1a}
    </style>
  </defs>
  <text x="28" y="36" class="title">Cache efficiency</text>
  <text x="28" y="56" class="tiny muted">How much prompt-cache reads are saving you this cycle</text>

  <rect x="28" y="78" width="270" height="88" rx="12" class="kpi"/>
  <text x="48" y="104" class="tiny muted">HIT RATE</text>
  <text x="48" y="140" style="font-size:32px;font-weight:800">62%</text>

  <rect x="314" y="78" width="270" height="88" rx="12" class="kpi"/>
  <text x="334" y="104" class="tiny muted">CACHE READS</text>
  <text x="334" y="140" style="font-size:32px;font-weight:800">1.8M</text>

  <rect x="600" y="78" width="270" height="88" rx="12" class="kpi"/>
  <text x="620" y="104" class="tiny muted">NEW INPUT</text>
  <text x="620" y="140" style="font-size:32px;font-weight:800">1.1M</text>

  <rect x="886" y="78" width="286" height="88" rx="12" class="kpi"/>
  <text x="906" y="104" class="tiny muted">OUTPUT</text>
  <text x="906" y="140" style="font-size:32px;font-weight:800">420k</text>

  <text x="28" y="198" class="small muted">1.8M tokens served from cache (62% hit rate)  strong reuse this cycle.</text>

  <!-- legend -->
  <rect x="28" y="220" width="10" height="10" rx="2" fill="#2dd4bf"/>
  <text x="44" y="229" class="tiny muted">Auto</text>
  <rect x="100" y="220" width="10" height="10" rx="2" fill="#3b82f6"/>
  <text x="116" y="229" class="tiny muted">GPT-5</text>
  <rect x="180" y="220" width="10" height="10" rx="2" fill="#a855f7"/>
  <text x="196" y="229" class="tiny muted">Sonnet</text>
  <rect x="270" y="220" width="10" height="10" rx="2" fill="#eab308"/>
  <text x="286" y="229" class="tiny muted">Composer</text>
  <rect x="380" y="220" width="10" height="10" rx="2" fill="#f87171"/>
  <text x="396" y="229" class="tiny muted">Opus</text>


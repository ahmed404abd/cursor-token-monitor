<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0c0c"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <radialGradient id="glow" cx=".15" cy="0" r=".55"><stop stop-color="#e85d4c" stop-opacity=".18"/><stop offset="1" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".4"/></filter>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#f2ebe8}
      .muted{fill:#8a7f7a}.tiny{font-size:11px}.small{font-size:13px}.title{font-size:18px;font-weight:700}.strong{font-weight:700}
      .card{fill:#141414;stroke:#2a1a1a}
    </style>
  </defs>
  <rect width="1200" height="640" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="640" rx="20" fill="url(#glow)"/>

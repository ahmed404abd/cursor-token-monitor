    <rect x="154" width="58" height="28" rx="14" fill="#1a1212" stroke="#5a2020"/><text x="183" y="18" text-anchor="middle" class="tiny" style="fill:#e85d4c">Cycle</text>
    <rect x="222" width="58" height="28" rx="14" fill="#1a1212" stroke="#5a2020"/><text x="251" y="18" text-anchor="middle" class="tiny" style="fill:#e85d4c">Spend</text>
    <rect x="286" width="58" height="28" rx="14" fill="#152033" stroke="#2a1a1a"/><text x="315" y="18" text-anchor="middle" class="tiny muted">Tokens</text>
  </g>

  <rect x="28" y="78" width="1144" height="420" rx="16" class="card" filter="url(#shadow)"/>
